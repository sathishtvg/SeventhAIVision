name: CI

# `develop` never existed — the working branch is `Development`, and GitHub
# branch names are case-sensitive, so every push to it triggered nothing. By
# the time this was noticed, 43 commits had landed without a single check
# running, including 270 frontend type errors that `npm run typecheck` below
# would have caught on the first push.
on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests (run inside Docker Compose, matching local dev) ──────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/backend.Dockerfile', 'backend/pyproject.toml', 'shared/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-buildx-

      # Compose resolves ${VAR} from the .env in its PROJECT directory, which
      # is docker/ (where the compose file lives) — not the repo root this used
      # to copy to. Every variable has a dev default in the compose file, so
      # the misplaced copy was harmless, but a .env that Compose never reads is
      # a trap for whoever edits it next expecting an effect.
      - name: Copy env file
        run: cp .env.example docker/.env

      - name: Build images
        run: docker compose -f docker/docker-compose.yml build --progress=plain api
        env:
          DOCKER_BUILDKIT: 1

      - name: Start core services
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres redis
          docker compose -f docker/docker-compose.yml up -d api

      - name: Wait for API (which runs migrations on startup)
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/docker-compose.yml exec -T api curl -sf http://localhost:8000/health; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done

      # The suite runs against seventh_ai_vision_test, NOT the app database.
      # docker/postgres/create-test-db.sh creates that database on first boot,
      # but only creates it — grants and pg_partman, no schema. Nothing has
      # ever migrated it: conftest.py assumes it is already at head, and the
      # api container migrates the app database on startup, not this one.
      #
      # So every DB-touching test failed on "relation does not exist", which
      # is why this job had not passed once in 37 runs. Locally it works only
      # because somebody migrated the test database by hand at some point and
      # the volume kept it.
      #
      # Appending _test to the container's own ALEMBIC_DATABASE_URL matches
      # exactly how create-test-db.sh derives the name (${POSTGRES_DB}_test),
      # and avoids restating the credentials here.
      - name: Migrate the test database
        run: |
          docker compose -f docker/docker-compose.yml exec -T api sh -c \
            'cd /app/backend && ALEMBIC_DATABASE_URL="${ALEMBIC_DATABASE_URL}_test" alembic upgrade head'

      # --junitxml goes to /tmp, NOT /app/backend.
      #
      # The image copies the source in as root with mode 755 and runs as
      # appuser, so /app/backend is read-only to the process running the
      # tests. pytest writes the JUnit file in pytest_sessionfinish — AFTER
      # every test has passed — then dies with PermissionError and exits 1.
      # So this step failed with the whole suite green and a stack trace
      # naming neither a test nor a database, which is why it read as a test
      # failure for months and was not one.
      - name: Run backend tests
        run: |
          docker compose -f docker/docker-compose.yml exec -T api \
            python -m pytest /app/backend/tests/ -v --tb=short \
            --junitxml=/tmp/test-results.xml

      # The suites above run with `compose exec`, inside the api image — which
      # ships only backend/. Every test that inspects a repo-root artifact
      # (Helm charts, Dockerfiles, SOPS and Trivy policy, SBOM and renovate
      # config, the SLO rules) skips itself there, quite deliberately: see
      # backend/tests/_repo.py, which says to run them "from a working tree, or
      # CI with the repo cloned". That never happened, so 1122 tests — every
      # secret-scanning, container-hardening and dependency-policy check —
      # ran nowhere at all, and a stale migration head sat failing for two
      # months unseen. A runner HAS the tree, so mounting the checkout over
      # /app is all they need.
      # Every suite carrying requires_repo_tree, selected by the marker rather
      # than a hand-written list — that list had drifted to seven of the
      # twenty-one that exist, so fourteen suites (Helm, OpenTelemetry, SLO,
      # Trivy, SOPS, SBOM, OpenAPI lint, GPU config, chaos, feature flags,
      # load-test config, compliance docs, API deprecation) ran nowhere at all.
      #
      # DATABASE_URL and REDIS_URL are passed explicitly. Without them conftest
      # falls back to localhost, which inside this one-off container is nothing,
      # and every test errors in session setup before it runs.
      - name: Run repo-inspection suites (skipped inside the api image)
        run: |
          API_IMAGE=$(docker compose -f docker/docker-compose.yml images -q api)
          API_CID=$(docker compose -f docker/docker-compose.yml ps -q api)
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$API_CID")
          DB_URL=$(docker compose -f docker/docker-compose.yml exec -T api printenv DATABASE_URL)
          set +e
          docker run --rm --network "$NET" \
            -v "${{ github.workspace }}:/app" -w /app \
            -e DATABASE_URL="${DB_URL}_test" \
            -e REDIS_URL="redis://redis:6379/0" \
            --entrypoint python "$API_IMAGE" \
            -m pytest -p no:cacheprovider --timeout=300 \
            -m repo_tree \
            --junitxml=/app/repo-test-results.xml \
            backend/tests/
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # The exit code alone has never been enough to diagnose this job.
            # 5 means "no tests were collected", which wants a completely
            # different fix from "tests failed" — so say which, and show what
            # pytest actually saw.
            if [ "$code" -eq 5 ]; then
              echo "::error::repo-inspection collected NO tests (pytest exit 5)."\
                   " The -m repo_tree selection matched nothing on this runner."
            else
              echo "::error::repo-inspection failed with pytest exit $code"
            fi
            echo "::group::what pytest saw"
            docker run --rm --network "$NET" \
              -v "${{ github.workspace }}:/app" -w /app \
              -e DATABASE_URL="${DB_URL}_test" \
              -e REDIS_URL="redis://redis:6379/0" \
              --entrypoint python "$API_IMAGE" \
              -m pytest -m repo_tree backend/tests/ --collect-only -q 2>&1 \
              | tail -25 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
            exit "$code"
          fi

      - name: Upload repo-inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-inspection-test-results
          path: repo-test-results.xml
          if-no-files-found: ignore

      - name: Extract test results
        if: always()
        run: |
          docker cp "$(docker compose -f docker/docker-compose.yml ps -q api)":/tmp/test-results.xml \
            ./test-results.xml 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

      # The step log and the uploaded artifact both need a token to read. Check-run
      # annotations do not — so surface the failures there too. This job had failed
      # 37 times running while reporting nothing but "Process completed with exit
      # code 1", and every diagnosis so far has started by guessing what that meant.
      - name: Report failing tests as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "test-results.xml"
          if not os.path.exists(path):
              print("::warning::no test-results.xml — pytest died before writing it, "
                    "so the failure is in collection, startup, or the container itself")
              raise SystemExit(0)

          tree = ET.parse(path)
          bad = []
          for case in tree.iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is not None:
                      bad.append((kind, case.get("classname", ""), case.get("name", ""),
                                  (node.get("message") or "").strip()))

          if not bad:
              print("::notice::JUnit XML records no failures; if the job still failed, "
                    "pytest exited non-zero after the tests ran (see the 0096-era "
                    "read-only /app/backend JUnit bug for precedent)")
              raise SystemExit(0)

          print(f"::error::{len(bad)} backend test(s) failed")
          for kind, classname, name, message in bad[:50]:
              flat = " | ".join(message.splitlines())[:700]
              print(f"::error title={classname}::{name} [{kind}] {flat}")
          if len(bad) > 50:
              print(f"::error::and {len(bad) - 50} more")
          PY


      # ── The §52 flow, end to end ──────────────────────────────────────────
      #
      # The unit tests cover the pieces; this is the only thing that exercises
      # the whole flow -- login, the real scheduler, a real RTSP capture, the
      # reports, the stored row, the queued email, the incident. Every defect
      # this module shipped with was found by running it rather than reading it,
      # including three scheduler jobs that failed every cycle and an endpoint
      # that had never once returned a 200.
      #
      # No real camera is needed: mediamtx generates the streams from the video
      # files committed under docker/mediamtx/videos, and the script seeds its
      # own tenant, site and cameras against them.
      - name: Start the test camera source
        run: docker compose -f docker/docker-compose.yml up -d mediamtx

      - name: Wait for a live RTSP stream
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/docker-compose.yml exec -T api \
                 ffprobe -rtsp_transport tcp -timeout 5000000 \
                 -i rtsp://mediamtx:8554/cam1 -show_entries stream=codec_name \
                 -of csv=p=0 >/dev/null 2>&1; then
              echo "cam1 is publishing"
              exit 0
            fi
            sleep 4
          done
          echo "::error::mediamtx never published cam1; the end-to-end run cannot capture a frame"
          docker compose -f docker/docker-compose.yml logs mediamtx | tail -40
          exit 1

      - name: Virtual patrol end-to-end (§52)
        run: |
          docker compose -f docker/docker-compose.yml cp \
            scripts/ops/vpatrol_e2e.py api:/tmp/vpatrol_e2e.py
          docker compose -f docker/docker-compose.yml exec -T api \
            python /tmp/vpatrol_e2e.py

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # ── Frontend (typecheck + lint + build) ────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # The 80 vitest tests existed but ran nowhere in CI. They cover the
      # permission-driven nav, so a role losing or gaining a menu entry was
      # invisible to every check here.
      - name: Test
        run: npm run test:run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000

  # ── Mobile checks ─────────────────────────────────────────────────────────
  #
  # The 66 jest tests existed and ran nowhere. Neither did the typecheck. The
  # guard app is the half of this product that goes out on a site, and nothing
  # here gated a regression in it from reaching main — a broken offline outbox
  # or a screen that no longer compiles would have shipped silently.
  #
  # No lint step: mobile has no lint script, unlike frontend. Worth adding, but
  # not by inventing a config in a CI file.
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # postinstall runs patch-package against mobile/patches — currently one
      # patch to expo-modules-core. `npm ci` honours it; `npm i --ignore-scripts`
      # would not, and the app would build against unpatched native modules.
      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Type check
        run: npm run ts
        working-directory: mobile

      - name: Test
        run: npm test -- --ci
        working-directory: mobile
