name: CI

# `develop` never existed — the working branch is `Development`, and GitHub
# branch names are case-sensitive, so every push to it triggered nothing. By
# the time this was noticed, 43 commits had landed without a single check
# running, including 270 frontend type errors that `npm run typecheck` below
# would have caught on the first push.
on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests (run inside Docker Compose, matching local dev) ──────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/backend.Dockerfile', 'backend/pyproject.toml', 'shared/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-buildx-

      # Compose resolves ${VAR} from the .env in its PROJECT directory, which
      # is docker/ (where the compose file lives) — not the repo root this used
      # to copy to. Every variable has a dev default in the compose file, so
      # the misplaced copy was harmless, but a .env that Compose never reads is
      # a trap for whoever edits it next expecting an effect.
      - name: Copy env file
        run: cp .env.example docker/.env

      - name: Build images
        run: docker compose -f docker/docker-compose.yml build --progress=plain api
        env:
          DOCKER_BUILDKIT: 1

      - name: Start core services
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres redis
          docker compose -f docker/docker-compose.yml up -d api

      - name: Wait for API (which runs migrations on startup)
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/docker-compose.yml exec -T api curl -sf http://localhost:8000/health; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done

      # The suite runs against seventh_ai_vision_test, NOT the app database.
      # docker/postgres/create-test-db.sh creates that database on first boot,
      # but only creates it — grants and pg_partman, no schema. Nothing has
      # ever migrated it: conftest.py assumes it is already at head, and the
      # api container migrates the app database on startup, not this one.
      #
      # So every DB-touching test failed on "relation does not exist", which
      # is why this job had not passed once in 37 runs. Locally it works only
      # because somebody migrated the test database by hand at some point and
      # the volume kept it.
      #
      # Appending _test to the container's own ALEMBIC_DATABASE_URL matches
      # exactly how create-test-db.sh derives the name (${POSTGRES_DB}_test),
      # and avoids restating the credentials here.
      - name: Migrate the test database
        run: |
          docker compose -f docker/docker-compose.yml exec -T api sh -c \
            'cd /app/backend && ALEMBIC_DATABASE_URL="${ALEMBIC_DATABASE_URL}_test" alembic upgrade head'

      # --junitxml goes to /tmp, NOT /app/backend.
      #
      # The image copies the source in as root with mode 755 and runs as
      # appuser, so /app/backend is read-only to the process running the
      # tests. pytest writes the JUnit file in pytest_sessionfinish — AFTER
      # every test has passed — then dies with PermissionError and exits 1.
      # So this step failed with the whole suite green and a stack trace
      # naming neither a test nor a database, which is why it read as a test
      # failure for months and was not one.
      - name: Run backend tests
        run: |
          docker compose -f docker/docker-compose.yml exec -T api \
            python -m pytest /app/backend/tests/ -v --tb=short \
            --junitxml=/tmp/test-results.xml

      # The suites above run with `compose exec`, inside the api image — which
      # ships only backend/. Every test that inspects a repo-root artifact
      # (Helm charts, Dockerfiles, SOPS and Trivy policy, SBOM and renovate
      # config, the SLO rules) skips itself there, quite deliberately: see
      # backend/tests/_repo.py, which says to run them "from a working tree, or
      # CI with the repo cloned". That never happened, so 1122 tests — every
      # secret-scanning, container-hardening and dependency-policy check —
      # ran nowhere at all, and a stale migration head sat failing for two
      # months unseen. A runner HAS the tree, so mounting the checkout over
      # /app is all they need.
      - name: Run repo-inspection suites (skipped inside the api image)
        run: |
          API_IMAGE=$(docker compose -f docker/docker-compose.yml images -q api)
          API_CID=$(docker compose -f docker/docker-compose.yml ps -q api)
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$API_CID")
          docker run --rm --network "$NET" \
            -v "${{ github.workspace }}:/app" -w /app \
            --entrypoint python "$API_IMAGE" \
            -m pytest -q -p no:cacheprovider --timeout=300 \
            --junitxml=/app/repo-test-results.xml \
            backend/tests/test_secret_scanning.py \
            backend/tests/test_container_hardening.py \
            backend/tests/test_dependency_policy.py \
            backend/tests/test_logging_policy.py \
            backend/tests/test_migration_safety.py \
            backend/tests/test_backup.py \
            backend/tests/test_pip_audit.py

      - name: Upload repo-inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-inspection-test-results
          path: repo-test-results.xml
          if-no-files-found: ignore

      - name: Extract test results
        if: always()
        run: |
          docker cp "$(docker compose -f docker/docker-compose.yml ps -q api)":/tmp/test-results.xml \
            ./test-results.xml 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # ── Frontend (typecheck + lint + build) ────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # The 80 vitest tests existed but ran nowhere in CI. They cover the
      # permission-driven nav, so a role losing or gaining a menu entry was
      # invisible to every check here.
      - name: Test
        run: npm run test:run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
