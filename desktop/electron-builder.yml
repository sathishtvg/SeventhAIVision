appId: ai.seventh.vision.desktop
productName: "Seventh AI Vision"
copyright: "Copyright © 2026 Seventh AI"

directories:
  output: release
  buildResources: assets

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # MSI for silent/managed deployment via Group Policy / Intune / SCCM (Gap 94)
    - target: msi
      arch: [x64]
  # Authenticode code signing (Gap 94). Whether the build is signed, and with
  # what, is read from the environment by scripts/signing-config.js, which
  # this file builds on (`extends`, at the foot): Azure Artifact Signing, a
  # certificate in the Windows certificate store (a token, or an authority's
  # cloud key), or a .pfx file. With none of them set the build is unsigned
  # (unchanged from before). CODE_SIGNING.md says which to get and how.
  #
  # The publisher's name is set there too, from WIN_PUBLISHER_NAME. It used to
  # be written here as `publisherName: ${env.WIN_PUBLISHER_NAME}`, and that
  # was never filled in: electron-builder fills such a name in only in file
  # names, so the publisher was, to the letter, "${env.WIN_PUBLISHER_NAME}".
  # Nothing read it - it is what an update is checked against, and updates
  # are not published (`publish: null`) - so nothing broke. It would have, the
  # day they were.
  signtoolOptions:
    # (Was `win.publisherName` before that, which electron-builder deprecated
    # in favour of this block and warned about on every build.)
    # rfc3161TimeStampServer keeps signatures valid after the cert expires.
    rfc3161TimeStampServer: http://timestamp.digicert.com
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Seventh AI Vision"

msi:
  oneClick: false
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Seventh AI Vision"
  # Stable UpgradeCode so future MSIs upgrade in place instead of installing
  # side-by-side. Generated once; must never change across releases.
  upgradeCode: "5F3A9C21-8B47-4E2D-9A16-7C0E1F2B3D4A"

# verifyUpdateCodeSignature only applies to signed builds; harmless when unsigned.
publish: null

extraResources:
  - from: dist
    to: dist
    filter: "**/*"

# Signing, from the environment. This file is laid over what that one answers,
# so anything said here wins; with no signing asked for it answers nothing.
extends: ./scripts/signing-config.js
