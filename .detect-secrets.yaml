# detect-secrets baseline configuration — Gap 28
# Seventh AI Vision
#
# Generated and maintained by: scripts/security/scan-secrets.sh --baseline
# Policy:                       config/secret-scanning-policy.yml
#
# IMPORTANT: Never manually edit the `results` section. Run:
#   ./scripts/security/scan-secrets.sh --baseline
# to regenerate it. Commit the updated baseline alongside the code change.

version: "1.5.0"

# ── Enabled plugins / detectors ──────────────────────────────────────────────
plugins_used:
  - name: ArtifactoryDetector
  - name: AWSKeyDetector
  - name: AzureStorageKeyDetector
  - name: BasicAuthDetector
  - name: CloudantDetector
  - name: DiscordBotTokenDetector
  - name: GitHubTokenDetector
  - name: HexHighEntropyString
    limit: 3.0
  - name: IbmCloudIamDetector
  - name: IbmCosHmacDetector
  - name: JwtTokenDetector
  - name: KeywordDetector
    keyword_exclude: "change_me_dev_only|REPLACE_ME|change_me|your_secret_here|dev_only|example|changeme|test_secret|fake_token|dummy_key|mock_password|test_api_key"
  - name: MailchimpDetector
  - name: NpmDetector
  - name: OpenAIDetector
  - name: PrivateKeyDetector
  - name: PypiTokenDetector
  - name: SendGridDetector
  - name: SlackDetector
  - name: SoftlayerDetector
  - name: SquareOAuthDetector
  - name: StripeDetector
  - name: TwilioKeyDetector

# ── File exclusion filters ────────────────────────────────────────────────────
filters_used:
  - path: detect_secrets.filters.allowlist.is_line_allowlisted
  - path: detect_secrets.filters.common.is_ignored_due_to_verification_policies
    min_level: 2
  - path: detect_secrets.filters.gibberish.should_exclude_secret
    limit: 3.7
  - path: detect_secrets.filters.heuristic.is_filtered_out
  - path: detect_secrets.filters.regex.should_exclude_regex
    pattern:
      # Placeholder values — not real secrets
      - "change_me_dev_only"
      - "REPLACE_ME"
      - "your_secret_here"
      - "test_secret"
      - "fake_token"
      - "dummy_key"
      - "mock_password"
      - "test_api_key"
      # Documentation examples
      - "AKIAIOSFODNN7EXAMPLE"
      - "wJalrXUtnFEMI"
  - path: detect_secrets.filters.regex.should_exclude_file
    pattern:
      - ".venv/.*"
      - ".venv-worker/.*"
      - "node_modules/.*"
      - "dist/.*"
      - "build/.*"
      - "__pycache__/.*"
      - "\\.pyc$"
      - ".*\\.lock$"
      - ".detect-secrets.yaml"
      - "sbom/.*"
      - "security-reports/.*"

# ── Baseline results ──────────────────────────────────────────────────────────
# Known false-positives reviewed and accepted by the security team.
# Each entry carries the line hash and type, not the actual secret value.
results: {}

