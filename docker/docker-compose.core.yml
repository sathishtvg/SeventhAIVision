# Lightweight stack — excludes all AI worker services (torch/paddle/ultralytics = ~5 GB ML images).
# Use this when disk space is limited. The full stack with AI workers lives in docker-compose.yml.
# Run with: docker compose -f docker/docker-compose.core.yml --env-file .env up --build -d

x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY_CURRENT: "${JWT_SECRET_KEY_CURRENT:-change_me_dev_only}"
  JWT_SECRET_KEY_PREVIOUS: "${JWT_SECRET_KEY_PREVIOUS:-}"
  JWT_ACTIVE_KID: "${JWT_ACTIVE_KID:-2026-06}"
  JWT_PREVIOUS_KID: "${JWT_PREVIOUS_KID:-}"
  JWT_ALGORITHM: HS256
  EVIDENCE_ROOT: /data/evidence
  RECORDINGS_ROOT: /data/recordings
  LPR_CONFIDENCE_THRESHOLD: "${LPR_CONFIDENCE_THRESHOLD:-0.55}"
  FACE_MATCH_THRESHOLD: "${FACE_MATCH_THRESHOLD:-0.6}"
  INTRUSION_BREACH_COOLDOWN_SECONDS: "${INTRUSION_BREACH_COOLDOWN_SECONDS:-60}"
  EVIDENCE_RETENTION_DAYS: "${EVIDENCE_RETENTION_DAYS:-90}"
  SMTP_HOST: "${SMTP_HOST:-localhost}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@seventh.ai}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
  TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"

services:
  postgres:
    build: { context: .., dockerfile: docker/postgres.Dockerfile }
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-seventh_ai_vision}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me_dev_only}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:-svc_app}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-change_me_dev_only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    command: ["sh", "-c", "cd /app/backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_APP_USER:-svc_app}:${POSTGRES_APP_PASSWORD:-change_me_dev_only}@postgres:5432/${POSTGRES_DB:-seventh_ai_vision}"
      POSTGRES_HOST: postgres
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      GIT_SHA: "${GIT_SHA:-dev}"
      BUILD_DATE: "${BUILD_DATE:-dev}"
    volumes:
      - evidence_data:/data/evidence
      - recordings_data:/data/recordings
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestion:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    command: ["python", "-m", "app.ingestion_main"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_APP_USER:-svc_app}:${POSTGRES_APP_PASSWORD:-change_me_dev_only}@postgres:5432/${POSTGRES_DB:-seventh_ai_vision}"
      METRICS_PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    build: { context: .., dockerfile: docker/backend.Dockerfile }
    command: ["python", "-m", "app.scheduler_main"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_APP_USER:-svc_app}:${POSTGRES_APP_PASSWORD:-change_me_dev_only}@postgres:5432/${POSTGRES_DB:-seventh_ai_vision}"
      AUDIT_RETENTION_YEARS: "${AUDIT_RETENTION_YEARS:-7}"
      SCHEDULER_INTERVAL_SECONDS: "${SCHEDULER_INTERVAL_SECONDS:-86400}"
    volumes:
      - evidence_data:/data/evidence
      - audit_archive:/data/archive
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres_data: {}
  evidence_data: {}
  recordings_data: {}
  audit_archive: {}
  prometheus_data: {}
  grafana_data: {}
