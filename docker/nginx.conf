# ── Subdomain extraction ─────────────────────────────────────────────────────
# Parses the tenant subdomain from the Host header and makes it available as
# $tenant_subdomain. This is forwarded to the API as X-Tenant-Subdomain so
# the backend can optionally use it for unauthenticated subdomain-context
# endpoints (e.g. resolve-tenant). The frontend also reads it from the DOM
# hostname directly — this header is the server-side counterpart.
#
# Matches:
#   acme.seventh.ai        → acme  (production)
#   acme.localhost         → acme  (dev with .localhost subdomains)
#   acme.1.2.3.4.nip.io   → acme  (dev with nip.io wildcard DNS)
# Falls through to "" for bare localhost, bare IP, or unknown patterns.
map $host $tenant_subdomain {
    ~^(?P<sub>[a-z0-9][a-z0-9-]*)\.seventh\.ai$                       $sub;
    ~^(?P<sub>[a-z0-9][a-z0-9-]*)\.localhost$                         $sub;
    ~^(?P<sub>[a-z0-9][a-z0-9-]*)\.\d+\.\d+\.\d+\.\d+\.nip\.io$      $sub;
    default                                                             "";
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# All plain-HTTP requests are permanently redirected to HTTPS.
# The /.well-known/acme-challenge/ path is passed through without redirect so
# that Let's Encrypt HTTP-01 challenges can complete during cert issuance.
server {
    listen 80;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    # Certificate paths — populated by /docker-entrypoint.d/50-ssl-selfsigned.sh
    # on first boot, or replaced with real cert files placed in the certs_data volume.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS: TLS 1.2 minimum, TLS 1.3 preferred.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Never expose nginx version in Server: header or error pages.
    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────────────
    # HSTS: now that TLS terminates here, HSTS is safe to enable.
    # max-age=31536000 = 1 year; includeSubDomains covers tenant subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "0"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Docker's embedded DNS resolver — forces nginx to re-resolve 'api' per
    # request rather than caching the IP at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend.
    #
    # ^~ is load-bearing, not decoration. Without it nginx prefers the regex
    # location below for anything ending .js/.css/.png/..., because a regex
    # match beats a prefix match — so /api/v1/visitors/{id}/qr.png was looked
    # up as a file on disk and returned nginx's own 404, never reaching the
    # API. ^~ stops regex matching once this prefix is the longest match, so
    # an API route may end in any extension it likes.
    location ^~ /api/ {
        set $upstream_api api;
        proxy_pass http://$upstream_api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
    }

    # WebSocket proxy — requires HTTP/1.1 + upgrade headers.
    # ^~ for the same reason as /api/ above.
    location ^~ /ws/ {
        set $upstream_api api;
        proxy_pass         http://$upstream_api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-Subdomain $tenant_subdomain;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — any path not matching a real file serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache static assets (content-hashed filenames from Vite build).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable"                always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options        "DENY"                             always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "0"                               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;
}
