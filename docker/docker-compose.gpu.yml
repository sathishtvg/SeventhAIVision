# GPU override for Docker Compose.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up -d
#
# Prerequisites:
#   - NVIDIA GPU with driver >= 525
#   - NVIDIA Container Toolkit installed (see scripts/gpu-setup.sh)
#   - Docker daemon configured for nvidia runtime:
#       nvidia-ctk runtime configure --runtime=docker && systemctl restart docker
#
# Each AI worker gets exclusive access to one GPU by default (count: 1).
# For multi-GPU hosts, change count or use "all" to share across workers.
# Shared memory (shm_size) is increased to 2 GB for CUDA tensor operations.
#
# Each worker is built from docker/ai-worker-gpu.Dockerfile (CUDA torch, onnxruntime-gpu,
# paddlepaddle-gpu) under its own image name, ending -gpu, so the CPU images built from
# docker-compose.yml alone are left as they are. Without this the workers kept the CPU
# image, and DEVICE=cuda on a CPU-only torch fell back to the CPU.
#
# Workers automatically detect CUDA via resolve_device() in device.py when
# DEVICE=cuda is set; CPU fallback applies when the env var is absent or "cpu".

services:

  ai-worker-lpr:
    build: { context: .., dockerfile: docker/ai-worker-gpu.Dockerfile }
    image: seventh-ai-vision/ai-worker-lpr-gpu:local
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '2gb'

  ai-worker-face:
