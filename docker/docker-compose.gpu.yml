  # Optional: NVIDIA Data Center GPU Manager exporter for Prometheus GPU metrics.
  # Exposes GPU temperature, memory usage, power draw, etc. at :9400/metrics.
  # Add to prometheus.yml scrape targets before enabling.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add: [SYS_ADMIN]
    ports: ["9400:9400"]
    profiles: [gpu-metrics]
