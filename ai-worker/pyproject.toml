[project]
name = "seventh-ai-vision-ai-worker"
version = "0.1.0"
description = "Synchronous AI inference workers: LPR, Face Recognition, Intrusion Detection"
requires-python = ">=3.11"
dependencies = [
    "seventh-ai-vision-shared",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.6,<3",
    "prometheus-client>=0.20",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2",
    "torch>=2.2",
    "ultralytics>=8.2",
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "shapely>=2.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
