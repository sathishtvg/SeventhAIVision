# Locust configuration — Seventh AI Vision
# Reference: https://docs.locust.io/en/stable/configuration.html
#
# Usage:
#   locust -f scripts/load_tests/locustfile.py --config scripts/load_tests/locust.conf
#
# Individual flags on the CLI override values here.

# ── Target ────────────────────────────────────────────────────────────────────
host = http://localhost:8000

# ── Load (overridden by StepLoadShape when the class is active) ───────────────
users = 100
spawn-rate = 10
run-time = 8m

# ── Output ────────────────────────────────────────────────────────────────────
html = reports/load_test_report.html
csv = reports/load_test
headless = true
only-summary = false

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel = INFO
logfile = reports/locust.log

# ── Web UI (only relevant when --headless is NOT set) ─────────────────────────
web-port = 8089
web-host = 127.0.0.1

# ── Misc ──────────────────────────────────────────────────────────────────────
# Reset statistics between spawn steps so per-stage stats are comparable.
reset-stats = false
