global:
  scrape_interval: 15s
  evaluation_interval: 30s

# SLO recording rules (pre-aggregate time-window SLIs) and burn-rate alert rules.
# Both files are loaded by Prometheus at startup; hot-reload via SIGHUP or /-/reload.
rule_files:
  - "slo/recording-rules.yml"
  - "slo/alert-rules.yml"

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8001"]

  - job_name: ai-worker-lpr
    static_configs:
      - targets: ["ai-worker-lpr:8001"]

  - job_name: ai-worker-face
    static_configs:
      - targets: ["ai-worker-face:8001"]

  - job_name: ai-worker-intrusion
    static_configs:
      - targets: ["ai-worker-intrusion:8001"]

  - job_name: ai-worker-ppe
    static_configs:
      - targets: ["ai-worker-ppe:8001"]

  - job_name: ai-worker-crowd
    static_configs:
      - targets: ["ai-worker-crowd:8001"]

  - job_name: ai-worker-fire-smoke
    static_configs:
      - targets: ["ai-worker-fire-smoke:8001"]

  - job_name: ai-worker-weapon
    static_configs:
      - targets: ["ai-worker-weapon:8001"]

  - job_name: ai-worker-behavior
    static_configs:
      - targets: ["ai-worker-behavior:8001"]

  - job_name: ai-worker-tampering
    static_configs:
      - targets: ["ai-worker-tampering:8001"]

  - job_name: ai-worker-abandoned
    static_configs:
      - targets: ["ai-worker-abandoned:8001"]

  - job_name: ai-worker-fall
    static_configs:
      - targets: ["ai-worker-fall:8001"]

  # NVIDIA DCGM Exporter — GPU metrics (temperature, memory, power, utilisation).
  # Only active when dcgm-exporter service is running (docker-compose.gpu.yml or
  # Helm dcgmExporter.enabled=true). Prometheus will log a scrape error and keep
  # retrying if the target is absent — safe to leave configured in the base file.
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
