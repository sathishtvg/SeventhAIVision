{{- range .Values.aiWorkers }}
{{- if and .enabled .autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "seventh-ai-vision.fullname" $ }}-ai-worker-{{ .name | replace "_" "-" }}
  labels:
    {{- include "seventh-ai-vision.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ai-worker
    ai.seventh/module: {{ .name | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "seventh-ai-vision.fullname" $ }}-ai-worker-{{ .name | replace "_" "-" }}
  minReplicas: {{ .autoscaling.minReplicas }}
  maxReplicas: {{ .autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
