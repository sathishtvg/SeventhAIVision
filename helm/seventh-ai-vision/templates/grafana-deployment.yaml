{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-grafana
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  serviceName: {{ include "seventh-ai-vision.fullname" . }}-grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "seventh-ai-vision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "seventh-ai-vision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: grafana-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.grafana.storage.size | quote }}
        {{- if .Values.grafana.storage.storageClass }}
        storageClassName: {{ .Values.grafana.storage.storageClass | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-grafana
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "seventh-ai-vision.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
