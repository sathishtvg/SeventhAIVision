{{- if not .Values.minio.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-evidence
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.evidence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.evidence.size | quote }}
  {{- if .Values.persistence.evidence.storageClass }}
  storageClassName: {{ .Values.persistence.evidence.storageClass | quote }}
  {{- end }}
{{- end }}
---
# Recordings are files whatever the evidence store is. The recorder (in the
# ingestion pod) writes them, the API plays them and the scheduler verifies and
# purges them, so the three must share one disk. With MinIO enabled this claim
# was left out along with the evidence claim: evidence had moved to the object
# store, recordings had not, and they landed on the ingestion pod's own disk —
# where the API could not play them and a restart lost them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-recordings
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.recordings.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.recordings.size | quote }}
  {{- if .Values.persistence.recordings.storageClass }}
  storageClassName: {{ .Values.persistence.recordings.storageClass | quote }}
  {{- end }}
---
# Check-in and check-out selfies, and the faces registered for check-in
# (app/services/staff_faces.py), are files whatever the evidence store is. The
# API writes and shows them; the scheduler's daily cycle deletes the face of an
# account that was deactivated. Without this claim they were written into the
# API pod itself: lost when it restarted, and a selfie taken through one API
# replica could not be shown through another. Found 24 October 2026.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-attendance-photos
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.attendancePhotos.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.attendancePhotos.size | quote }}
  {{- if .Values.persistence.attendancePhotos.storageClass }}
  storageClassName: {{ .Values.persistence.attendancePhotos.storageClass | quote }}
  {{- end }}
