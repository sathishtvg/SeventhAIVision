apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-api
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "seventh-ai-vision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "seventh-ai-vision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "seventh-ai-vision.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: alembic-migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["sh", "-c", "cd /app/backend && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-config
            - secretRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-secret
        {{- if .Values.api.prepareFaceModels }}
        # Fetches the face model once into the shared claim. Pods starting together take turns (flock); the
        # marker is written only after the model is unpacked, so a fetch that was cut short is done again.
        - name: prepare-face-models
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              cd /home/appuser/.insightface
              exec 9>.prepare.lock
              flock 9
              if [ ! -f models/buffalo_l/.complete ]; then
                rm -rf models/buffalo_l models/buffalo_l.zip
                python -c "from insightface.utils.storage import ensure_available; ensure_available('models', 'buffalo_l')"
                touch models/buffalo_l/.complete
                rm -f models/buffalo_l.zip
              fi
          volumeMounts:
            - name: face-models
              mountPath: /home/appuser/.insightface
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          workingDir: /app/backend
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-config
            - secretRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-secret
          # pg_dump (app/core/backup.py) reads the superuser's password from PGPASSWORD; the secret names it
          # POSTGRES_PASSWORD. compose gives it as PGPASSWORD; without it a cluster's backup failed: "no password".
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "seventh-ai-vision.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: BACKUP_ROOT
              value: /data/backups
            - name: BACKUP_KEEP_DAILY
              value: {{ .Values.persistence.backups.keepDaily | quote }}
          volumeMounts:
            {{- if not .Values.minio.enabled }}
            - name: evidence
              mountPath: /data/evidence
            {{- end }}
            # Mounted whatever the evidence store is: recordings are files, and
            # the API plays what the recorder in the ingestion pod wrote.
            - name: recordings
              mountPath: /data/recordings
            # Check-in selfies and registered faces (ATTENDANCE_PHOTOS_ROOT), shared by every replica.
            - name: attendance-photos
              mountPath: /data/attendance_photos
            # Staff files (EMPLOYEE_DOCS_ROOT) and guardhouse photos (GUARDHOUSE_PHOTOS_ROOT), shared likewise.
            - name: employee-docs
              mountPath: /data/employee_docs
            - name: guardhouse
              mountPath: /data/guardhouse
            # insightface keeps its models in ~/.insightface; the image runs as appuser.
            - name: face-models
              mountPath: /home/appuser/.insightface
            # Lists the scheduler's backups and writes an on-demand one (System > Backups).
            - name: backups
              mountPath: /data/backups
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if not .Values.minio.enabled }}
        - name: evidence
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-evidence
        {{- end }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-recordings
        - name: attendance-photos
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-attendance-photos
        - name: employee-docs
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-employee-docs
        - name: guardhouse
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-guardhouse
        - name: face-models
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-face-models
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-backups
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
