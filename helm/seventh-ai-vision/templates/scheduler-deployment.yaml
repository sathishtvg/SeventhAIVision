apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-scheduler
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "seventh-ai-vision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "seventh-ai-vision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "seventh-ai-vision.serviceAccountName" . }}
      containers:
        - name: scheduler
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["python", "-m", "app.scheduler_main"]
          workingDir: /app/backend
          envFrom:
            - configMapRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-config
            - secretRef:
                name: {{ include "seventh-ai-vision.fullname" . }}-secret
          # pg_dump (app/core/backup.py) reads the superuser's password from PGPASSWORD; the secret names it
          # POSTGRES_PASSWORD. compose gives it as PGPASSWORD; without it a cluster's backup failed: "no password".
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "seventh-ai-vision.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: BACKUP_ROOT
              value: /data/backups
            - name: BACKUP_KEEP_DAILY
              value: {{ .Values.persistence.backups.keepDaily | quote }}
          volumeMounts:
            {{- if not .Values.minio.enabled }}
            - name: evidence
              mountPath: /data/evidence
            {{- end }}
            # Read-only: the recording integrity sweep runs here and re-hashes
            # the recorded files. Without this it saw an empty directory and
            # marked every recording it checked as missing. Mounted whatever
            # the evidence store is.
            - name: recordings
              mountPath: /data/recordings
              readOnly: true
            # Read-write: the daily cycle deletes the registered face of a deactivated account, photo included
            # (services/staff_face_retention.py).
            - name: attendance-photos
              mountPath: /data/attendance_photos
            # The daily database backup, and its rotation.
            - name: backups
              mountPath: /data/backups
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        {{- if not .Values.minio.enabled }}
        - name: evidence
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-evidence
        {{- end }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-recordings
        - name: attendance-photos
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-attendance-photos
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "seventh-ai-vision.fullname" . }}-backups
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
