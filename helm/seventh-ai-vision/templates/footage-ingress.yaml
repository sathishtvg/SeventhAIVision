{{- if and .Values.ingress.enabled .Values.footageWorker.enabled }}
# Footage Review takes a video in parts of 16 MB (backend/app/services/footage.py).
# Its own path, so only the upload may send that much: every other request keeps
# the ingress controller's default limit, as docker/nginx.conf does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-footage
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
    app.kubernetes.io/component: footage
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "17m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/footage/
            pathType: Prefix
            backend:
              service:
                name: {{ include "seventh-ai-vision.fullname" . }}-api
                port:
                  name: http
{{- end }}
