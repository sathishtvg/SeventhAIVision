apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seventh-ai-vision.fullname" . }}-config
  labels:
    {{- include "seventh-ai-vision.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ include "seventh-ai-vision.redisUrl" . | quote }}
  EVIDENCE_ROOT: "/data/evidence"
  RECORDINGS_ROOT: "/data/recordings"
  STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  LPR_CONFIDENCE_THRESHOLD: {{ .Values.config.lprConfidenceThreshold | quote }}
  FACE_MATCH_THRESHOLD: {{ .Values.config.faceMatchThreshold | quote }}
  INTRUSION_BREACH_COOLDOWN_SECONDS: {{ .Values.config.intrusionBreachCooldownSeconds | quote }}
  EVIDENCE_RETENTION_DAYS: {{ .Values.config.evidenceRetentionDays | quote }}
  WS_MAX_CONNECTIONS_PER_IP: {{ .Values.config.wsMaxConnectionsPerIp | quote }}
  S3_ENDPOINT_URL: {{ include "seventh-ai-vision.s3EndpointUrl" . | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_PRESIGN_TTL_SECONDS: {{ .Values.config.s3PresignTtlSeconds | quote }}
  SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  SMTP_USER: {{ .Values.config.smtp.user | quote }}
  SMTP_FROM: {{ .Values.config.smtp.from | quote }}
  TWILIO_FROM_NUMBER: {{ .Values.config.twilio.fromNumber | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  GIT_SHA: {{ .Values.config.gitSha | quote }}
  BUILD_DATE: {{ .Values.config.buildDate | quote }}
  JWT_ALGORITHM: "HS256"
  JWT_ACTIVE_KID: {{ .Values.secrets.jwtActiveKid | quote }}
  JWT_PREVIOUS_KID: {{ .Values.secrets.jwtPreviousKid | quote }}
