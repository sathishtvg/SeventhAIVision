# Default values for seventh-ai-vision.
nameOverride: ""
fullnameOverride: ""

# -- Image settings per service type
images:
  backend:
    repository: seventh-ai-vision/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  aiWorker:
    repository: seventh-ai-vision/ai-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: seventh-ai-vision/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  minio:
    repository: minio/minio
    tag: "latest"
    pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

# ─── API (FastAPI backend) ────────────────────────────────────────────────────
api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  service:
    type: ClusterIP
    port: 8000
  nodeSelector: {}
  tolerations: []

# ─── Camera ingestion service ─────────────────────────────────────────────────
ingestion:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  nodeSelector: {}
  tolerations: []

# ─── Daily maintenance scheduler ─────────────────────────────────────────────
scheduler:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []

# ─── AI worker pipelines ──────────────────────────────────────────────────────
# Set enabled: false to skip a particular module.
# Set gpu.enabled: true on a node with NVIDIA Container Toolkit installed.
aiWorkers:
  - name: lpr
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "4Gi"
    gpu:
      enabled: false
      count: 1
      resourceKey: "nvidia.com/gpu"
      shmSize: "2Gi"
    nodeSelector: {}
    tolerations: []

  - name: face
