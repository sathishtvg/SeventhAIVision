# Default values for seventh-ai-vision.
nameOverride: ""
fullnameOverride: ""

# -- Image settings per service type
images:
  backend:
    repository: seventh-ai-vision/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  aiWorker:
    repository: seventh-ai-vision/ai-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: seventh-ai-vision/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  # The project's database image (docker/postgres.Dockerfile): Postgres 16 with pgvector and pg_partman, which
  # the migrations need, and the first-start scripts that make the restricted app role (svc_app). Plain postgres:16
  # had neither: on a new cluster the first migration failed. Build and push it with the others:
  #   docker build -f docker/postgres.Dockerfile -t <registry>/seventh-ai-vision/postgres:1.0.0 .
  postgres:
    repository: seventh-ai-vision/postgres
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  minio:
    repository: minio/minio
    tag: "latest"
    pullPolicy: IfNotPresent
  # The footage worker (docker/footage-worker.Dockerfile): ONNX Runtime, ffmpeg and its models.
  footageWorker:
    repository: seventh-ai-vision/footage-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

# ─── API (FastAPI backend) ────────────────────────────────────────────────────
api:
  replicas: 2
  # Fetch the face model into persistence.faceModels before the API starts (an init container), so a guard's
  # first check-in after a new pod never waits for a 280 MB download. Needs egress to GitHub's release downloads,
  # once per cluster. Turn it off where the cluster has no egress and load the claim yourself
  # (models/buffalo_l/ under it, as insightface lays it out).
  prepareFaceModels: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
  service:
    type: ClusterIP
    port: 8000
  nodeSelector: {}
  tolerations: []

# ─── Camera ingestion service ─────────────────────────────────────────────────
ingestion:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  nodeSelector: {}
  tolerations: []

# ─── Daily maintenance scheduler ─────────────────────────────────────────────
scheduler:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []

# ─── Drone runner ────────────────────────────────────────────────────────────
# The process that flies for the Drone Patrol module: flight commands, drone
# health and links, scheduled patrols, the drone AI pipeline, patrol reports
# and the removal of expired footage. With nobody licensed for the module it
# has nothing to do. Set enabled: false on an installation that will never use
# the module.
droneRunner:
  enabled: true
  # Seconds between passes of each of its jobs.
  tickSeconds: 2
  healthSeconds: 15
  scheduleSeconds: 30
  aiSeconds: 3
  reportSeconds: 60
  # How often expired footage and flight tracks are removed; 0 never deletes.
  retentionSeconds: 21600
  # How long a flight's track is kept.
  telemetryRetentionDays: 365
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []

# ─── Security intelligence runner ────────────────────────────────────────────
# Reads what the platform has already recorded and writes situations,
# assessments and suggestions for people to act on. It takes no security action
# and is given nothing to act with: no port, no volume. Stopped, it stops only
# that layer — alerts, incidents and video carry on.
# The layer is off for every organisation until its own administrator switches
# it on, so a runner nobody uses costs one small query every few seconds.
intelligenceRunner:
  enabled: true
  # Seconds between two reads of every source, for every organisation with it on.
  tickSeconds: 3
  # How far back the first read goes when an organisation switches it on.
  backfillMinutes: 60
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []

# ─── Footage Review's worker (FOOTAGE_REVIEW.md) ──────────────────────────────
# Analyses uploaded videos one at a time and answers the API's searches. More
# videos waiting, more replicas. It raises no alert and no incident.
footageWorker:
  enabled: true
  replicas: 1
  # ONNX Runtime threads per model.
  threads: 2
  # The longest video it analyses, in seconds (6 hours).
  maxSeconds: 21600
  # Room for a playable copy made before it is sent to S3.
  scratchSize: "8Gi"
  # Let only the API reach its port 8090.
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: "1"
      memory: "1536Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  nodeSelector: {}
  tolerations: []

