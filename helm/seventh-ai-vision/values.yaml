# ─── Frontend (React/nginx) ───────────────────────────────────────────────────
frontend:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  service:
    type: ClusterIP
    port: 80
  nodeSelector: {}
  tolerations: []

# ─── PostgreSQL (internal; set enabled: false + supply externalUrl) ───────────
postgres:
  enabled: true
  externalUrl: ""
  database: seventh_ai_vision
  username: svc_app
  password: change_me_in_production
  superuserUsername: postgres
  superuserPassword: change_me_in_production
  storage:
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# ─── Redis (internal; set enabled: false + supply externalUrl) ────────────────
redis:
  enabled: true
  externalUrl: ""
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ─── MinIO object storage (set enabled: false to use local PVCs) ──────────────
minio:
  enabled: false
  externalEndpoint: ""
  bucket: evidence
  accessKey: minioadmin
  secretKey: change_me_in_production
  storage:
    size: 200Gi
    storageClass: ""
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ─── Persistent volumes (evidence/recordings — used when minio.enabled=false) ─
persistence:
  evidence:
    size: 100Gi
    storageClass: ""
    accessMode: ReadWriteMany
  recordings:
    size: 200Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # Check-in selfies and the faces registered for check-in: the API (every replica) and the scheduler share it.
  attendancePhotos:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # Staff files: employment documents, profile photos, leave attachments, SOP files (the API only).
  employeeDocs:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # Photos of defects and of lost and found property (the API only).
  guardhouse:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # The face model (insightface buffalo_l, ~330 MB unpacked, its ~280 MB download kept beside it until done).
  faceModels:
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # Database backups: the scheduler's daily pg_dump and the API's on-demand one, gzipped. keepDaily is how many
  # days are kept (the newest of each day). Size it at about keepDaily x the database's gzipped dump. With an
  # external database (postgres.enabled: false) the provider's own backups are usually the ones to rely on.
  backups:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteMany
    keepDaily: 7

# ─── Application runtime configuration (non-sensitive) ───────────────────────
config:
  storageBackend: local         # "local" or "s3"
  lprConfidenceThreshold: "0.55"
  faceMatchThreshold: "0.6"
  intrusionBreachCooldownSeconds: "60"
  evidenceRetentionDays: "90"
  # Audit log months older than this are moved out of the log into a file (never deleted).
  auditRetentionYears: "7"
  wsMaxConnectionsPerIp: "10"
  s3PresignTtlSeconds: "3600"
  s3EndpointUrl: ""
  s3Bucket: evidence
  smtp:
    host: ""
    port: "587"
    user: ""
    from: "noreply@seventh.ai"
  twilio:
    fromNumber: ""
  appVersion: "1.0.0"
  gitSha: "unknown"
  buildDate: "unknown"

# ─── Sensitive credentials (use Sealed Secrets / Vault in production) ─────────
# ─── S3 keys when MinIO is off ────────────────────────────────────────────────
# Leave both empty on AWS: the pods then use their IAM role (IRSA, serviceAccount.annotations).
# Set them only for an S3-compatible store that takes keys, from your secret store (--set or a values
# file kept out of the repository), never committed here.
s3:
  accessKey: ""
  secretKey: ""

secrets:
  jwtSecretKeyCurrent: change_me_in_production
  jwtSecretKeyPrevious: ""
  jwtActiveKid: "2026-06"
  jwtPreviousKid: ""
  smtpPassword: ""
  twilioAccountSid: ""
  twilioAuthToken: ""

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: vision.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: seventh-ai-vision-tls

# ─── Prometheus + Grafana (simple on-cluster; set enabled: false if using
#     external observability stack) ────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.55.1
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
  adminPassword: admin
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
    port: 3000

# ─── NVIDIA DCGM Exporter (GPU metrics for Prometheus) ───────────────────────
# Exposes GPU temperature, memory, utilisation, power draw at :9400/metrics.
# Set enabled: true on clusters where AI workers run on GPU nodes.
# The exporter must run on every GPU node; use a DaemonSet in production
# (configure via your cluster's Helm chart for dcgm-exporter separately, or
# set this to true for a single-node deployment convenience).
dcgmExporter:
  enabled: false
  image:
    repository: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: "3.3.5-3.4.0-ubuntu22.04"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector:
    nvidia.com/gpu: "true"
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
