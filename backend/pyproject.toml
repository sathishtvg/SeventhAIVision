[project]
name = "seventh-ai-vision-backend"
version = "0.1.0"
description = "FastAPI API + camera ingestion + scheduler"
requires-python = ">=3.11"
dependencies = [
    "seventh-ai-vision-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "opencv-python-headless>=4.9",
    "onvif-zeep-async>=4.0",
    "prometheus-client>=0.20",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "reportlab>=4.2",
    "pillow>=10.0",
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "boto3>=1.34",
    "stripe>=7.0",
    "python3-saml>=1.16",
    "ldap3>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Provides the `timeout` option set under [tool.pytest.ini_options]. It was
    # previously undeclared and only present in an older image by accident — a
    # clean dependency resolve dropped it, which silently turned that config
    # line into an "Unknown config option" warning and left the suite with NO
    # timeout at all. Declared explicitly so hang protection is reproducible.
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db.session's engine is a module-level singleton bound to whichever event
# loop exists when first used; pytest-asyncio's default per-test loop scope
# creates a NEW loop per test, which orphans that engine's pooled connections
# and breaks connection cleanup on Windows' ProactorEventLoop ("Event loop is
# closed" on teardown). Session-scoped loop keeps one consistent loop for the
# whole run instead — discovered by actually running the suite, not assumed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# 10s was too tight: the first test to touch `app.main` pays a one-time import
# cost for the ML stack (insightface / onnxruntime / torch) that on its own
# exceeds 10s on a cold container, so the first several tests of EVERY run
# failed on timeout while identical later tests passed — measured, not assumed.
# 120s still catches a genuinely hung test without failing on import warm-up.
timeout = 120
# Registered so `-m repo_tree` is selectable and an unknown-mark warning cannot
# appear. Applied by tests/_repo.py to every suite that inspects repository-root
# infrastructure rather than application behaviour.
markers = [
    "repo_tree: validates repo-root infrastructure files; needs the working tree",
]
