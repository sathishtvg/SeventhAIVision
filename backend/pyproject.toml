[project]
name = "seventh-ai-vision-backend"
version = "0.1.0"
description = "FastAPI API + camera ingestion + scheduler"
requires-python = ">=3.11"
dependencies = [
    "seventh-ai-vision-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "opencv-python-headless>=4.9",
    "onvif-zeep-async>=4.0",
    "prometheus-client>=0.20",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "reportlab>=4.2",
    "pillow>=10.0",
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "boto3>=1.34",
    "stripe>=7.0",
    "python3-saml>=1.16",
    "ldap3>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db.session's engine is a module-level singleton bound to whichever event
# loop exists when first used; pytest-asyncio's default per-test loop scope
# creates a NEW loop per test, which orphans that engine's pooled connections
# and breaks connection cleanup on Windows' ProactorEventLoop ("Event loop is
# closed" on teardown). Session-scoped loop keeps one consistent loop for the
# whole run instead — discovered by actually running the suite, not assumed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 10
