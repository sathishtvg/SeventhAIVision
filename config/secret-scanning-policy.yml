# Secret Scanning Policy — Gap 28
# Seventh AI Vision
#
# Defines the patterns, severity levels, exclusions, and CI gate rules for
# detecting secrets that must never appear in source code, config files, or
# any other committed artefact.
#
# Tool: detect-secrets (Yelp) — scans files without requiring a git repo
# Config: .detect-secrets.yaml (same directory)
# Script: scripts/security/scan-secrets.sh
# Tests:  backend/tests/test_secret_scanning.py

version: "1.0"
metadata:
  effective_date: "2026-07-02"
  owner: security@seventh.ai
  review_cycle: quarterly
  enforcement: pre-commit + CI gate

# ── Scope ─────────────────────────────────────────────────────────────────────
scope:
  include:
    - "**/*.py"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.env*"
    - "**/*.sh"
    - "**/*.sql"
    - "**/Dockerfile*"
    - "**/*.toml"
    - "**/*.cfg"
    - "**/*.conf"
    - "**/*.ini"
  exclude:
    - "**/*.lock"
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/.venv-worker/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/migrations/**"       # Alembic migrations are reviewed separately (Gap 26)
    - "**/tests/**"            # Test fixtures may use dummy secrets — vetted separately
    - ".detect-secrets.yaml"   # Baseline file itself
    - "sbom/**"                # SBOM outputs contain hashes, not secrets

# ── Secret pattern categories ─────────────────────────────────────────────────
patterns:
  # Category A — Credentials that CANNOT appear anywhere outside .env.example (dummy values)
  critical:
    - name: private_key_pem
      description: PEM-encoded private key block
      severity: critical
      example: "-----BEGIN RSA PRIVATE KEY-----"

    - name: aws_access_key
      description: AWS access key ID (AKIA... pattern)
      severity: critical
      example: "AKIAIOSFODNN7EXAMPLE"

    - name: jwt_secret_hardcoded
      description: JWT_SECRET_KEY with a real-looking value (not a placeholder)
      severity: critical
      example: "JWT_SECRET_KEY=some-real-secret-string"
      notes: "Placeholders like 'change_me_dev_only' are allowed in .env.example"

    - name: database_password_hardcoded
      description: POSTGRES_PASSWORD set to a non-placeholder value
      severity: critical
      example: "POSTGRES_PASSWORD=Actual$ecr3t!"

  # Category B — API credentials that indicate a real external service is in scope
  high:
    - name: twilio_auth_token
      description: Twilio authentication token (hex string)
      severity: high
      example: "TWILIO_AUTH_TOKEN=0a1b2c3d..."

    - name: smtp_password
      description: SMTP password for email delivery
      severity: high
      example: "SMTP_PASSWORD=actual_mail_password"

    - name: generic_api_key
      description: Variables named *_API_KEY or *_SECRET with non-placeholder values
      severity: high
      example: "OPENAI_API_KEY=sk-proj-..."

    - name: grafana_password
      description: Grafana admin password
      severity: high
      example: "GF_SECURITY_ADMIN_PASSWORD=supersecret"

  # Category C — Secrets in code (not env files)
  medium:
    - name: hardcoded_password_in_code
      description: password= / passwd= assignments with quoted string literals in .py/.ts
      severity: medium
      example: "password='hunter2'"

    - name: bearer_token_in_code
      description: Bearer token hardcoded in source
      severity: medium
      example: 'headers={"Authorization": "Bearer eyJhbGci..."}'

    - name: connection_string_with_password
      description: Database connection string containing an inline password
      severity: medium
      example: "postgresql://user:password@host/db"
      notes: "OK only in docker-compose.yml with ${} env-var substitution"

# ── Allowlist — patterns that look like secrets but are not ──────────────────
allowlist:
  # Placeholders used in .env.example, docker-compose.yml, and docs
  placeholder_values:
    - "change_me_dev_only"
    - "change_me"
    - "your_secret_here"
    - "REPLACE_ME"
    - "example"
    - "changeme"
    - "dev_only"
    - "<your_value>"
    - "<redacted>"

  # Test/fixture patterns — dummy values that are obviously not real
  test_patterns:
    - "test_secret"
    - "fake_token"
    - "dummy_key"
    - "mock_password"
    - "test_api_key"

  # Documentation examples
  doc_patterns:
    - "AKIAIOSFODNN7EXAMPLE"     # AWS documentation example key
    - "wJalrXUtnFEMI/K7MDENG"    # AWS documentation secret key
    - "0a1b2c3d4e5f..."           # Twilio documentation example

  # File-level exclusions — files allowed to contain secret-like patterns
  excluded_files:
    - ".env.example"
    - "docs/**"
    - "**/README.md"
    - ".detect-secrets.yaml"

# ── Severity-to-action mapping ────────────────────────────────────────────────
enforcement:
  critical:
    action: block            # CI hard-fails; pre-commit rejects commit
    notify: ["security@seventh.ai"]
    incident_severity: critical

  high:
    action: block
    notify: ["security@seventh.ai"]
    incident_severity: high

  medium:
    action: warn             # CI soft-fails (warning, not blocking) in dev; block in prod pipeline
    notify: []
    incident_severity: medium

# ── CI integration ────────────────────────────────────────────────────────────
ci_integration:
  fail_on_severity: high     # Block on critical + high; warn on medium
  script: "scripts/security/scan-secrets.sh --scan"
  baseline_file: ".detect-secrets.yaml"
  update_baseline_cmd: "scripts/security/scan-secrets.sh --baseline"
  pre_commit_hook: true      # Register as pre-commit hook via scripts/install-hooks.sh

# ── Reporting ─────────────────────────────────────────────────────────────────
reporting:
  output_formats: [json, text]
  output_dir: "security-reports/secrets"
  audit_log: true            # Every scan result appended to security-reports/secrets/audit.log
  retain_reports_days: 90

# ── Baseline management ───────────────────────────────────────────────────────
baseline:
  # The baseline encodes ALL currently known false-positives so they are
  # not re-flagged on every scan. Must be reviewed when updated.
  # Update with: scripts/security/scan-secrets.sh --baseline
  review_required_on_update: true
  max_baseline_entries: 50   # Alert if baseline grows beyond this (possible secret accumulation)
