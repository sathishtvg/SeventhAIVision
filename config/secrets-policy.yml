# Secret Management Policy — Gap 21
# Seventh AI Vision
#
# This policy defines:
#   - What secrets exist and their categories
#   - Where each secret is stored (env var, SOPS-encrypted file, Vault)
#   - Rotation schedule per category
#   - Access control (who/what can read each category)
#
# Enforcement:
#   - All new secrets must be registered here before use
#   - CI: scripts/secrets/rotate-secrets.sh validates compliance on every release
#   - SOPS rules: .sops.yaml defines which files are encrypted at rest

version: "1.0"
metadata:
  team: platform
  effective_date: "2026-07-01"
  review_cycle: quarterly
  owner: security@seventh.ai

# ── Secret categories ──────────────────────────────────────────────────────────
categories:

  # ── Database credentials ──────────────────────────────────────────────────
  - name: database
    description: "PostgreSQL connection credentials"
    secrets:
      - name: POSTGRES_PASSWORD
        env_var: POSTGRES_PASSWORD
        storage: sops_encrypted_env   # config/secrets/<env>.env
        rotation_days: 90
        notes: "Rotate after every team member departure"
      - name: DATABASE_URL
        env_var: DATABASE_URL
        storage: sops_encrypted_env
        rotation_days: 90
        notes: "Derived from POSTGRES_PASSWORD; update both together"
    rotation_days: 90
    access:
      services: [api, ingestion, scheduler, ai-worker-lpr, ai-worker-face,
                 ai-worker-intrusion, ai-worker-ppe, ai-worker-crowd,
                 ai-worker-fire-smoke, ai-worker-weapon, ai-worker-behavior,
                 ai-worker-tampering, ai-worker-abandoned, ai-worker-fall]
      humans: [dba, platform-lead]

  # ── JWT signing keys ───────────────────────────────────────────────────────
  - name: jwt
    description: "JWT access / refresh token signing secrets"
    secrets:
      - name: JWT_SECRET_KEY
        env_var: JWT_SECRET_KEY
        storage: sops_encrypted_env
        rotation_days: 180
        min_entropy_bits: 256
        notes: "Must be cryptographically random; never reuse across environments"
      - name: JWT_SECRET_KEY_PREVIOUS
        env_var: JWT_SECRET_KEY_PREVIOUS
        storage: sops_encrypted_env
        rotation_days: 180
        notes: "Kept alive for the token TTL window (max 7 days) after rotation"
    rotation_days: 180
    access:
      services: [api]
      humans: [platform-lead, security-team]

  # ── Notification provider credentials ─────────────────────────────────────
  - name: notifications
    description: "SMTP, Twilio, and webhook signing credentials"
    secrets:
      - name: SMTP_PASSWORD
        env_var: SMTP_PASSWORD
        storage: sops_encrypted_env
        rotation_days: 365
      - name: TWILIO_AUTH_TOKEN
        env_var: TWILIO_AUTH_TOKEN
        storage: sops_encrypted_env
        rotation_days: 365
      - name: WEBHOOK_SIGNING_SECRET
        env_var: WEBHOOK_SIGNING_SECRET
        storage: sops_encrypted_env
        rotation_days: 180
    rotation_days: 365
    access:
      services: [api]
      humans: [platform-lead]

  # ── Third-party API keys ───────────────────────────────────────────────────
  - name: external_apis
    description: "Keys for external services used by the platform"
    secrets:
      - name: S3_SECRET_ACCESS_KEY
        env_var: S3_SECRET_ACCESS_KEY
        storage: sops_encrypted_env
        rotation_days: 365
        notes: "Used for evidence S3 offload when S3_EVIDENCE_STORAGE feature flag enabled"
    rotation_days: 365
    access:
      services: [api, scheduler]
      humans: [platform-lead, devops]

  # ── Observability ──────────────────────────────────────────────────────────
  - name: observability
    description: "Grafana and Prometheus admin credentials"
    secrets:
      - name: GRAFANA_ADMIN_PASSWORD
        env_var: GRAFANA_ADMIN_PASSWORD
        storage: sops_encrypted_env
        rotation_days: 365
    rotation_days: 365
    access:
      services: [grafana]
      humans: [platform-lead, devops, on-call]

# ── Storage backends ───────────────────────────────────────────────────────────
storage_backends:
  sops_encrypted_env:
    description: "SOPS-encrypted .env files at config/secrets/<environment>.env"
    tool: sops
    encryption: age
    rules_file: .sops.yaml
    encrypted_files:
      - config/secrets/dev.env
      - config/secrets/staging.env
      - config/secrets/prod.env
    never_commit_unencrypted: true

  environment_variable:
    description: "Plain env vars — only for non-sensitive config (base URLs, feature toggles)"
    examples: [API_HOST, LOG_LEVEL, REDIS_URL]

# ── Rotation policy ────────────────────────────────────────────────────────────
rotation_policy:
  automated_check: "scripts/secrets/rotate-secrets.sh --check-expiry"
  ci_gate: true                        # CI fails if any secret past rotation_days
  alert_before_days: 14                # Warn 14 days before rotation is due
  emergency_rotation_procedure: >-
    1. Generate new secret value
    2. sops --encrypt --in-place config/secrets/<env>.env (update value)
    3. docker compose pull && docker compose up -d (rolling restart)
    4. Verify health: curl http://localhost:8000/health
    5. Revoke old secret with the issuing service
    6. Update rotation_last_date in this file

# ── What must NEVER appear in plaintext in the repo ────────────────────────────
prohibited_in_plaintext:
  - passwords
  - private_keys
  - api_keys
  - tokens
  - connection_strings_with_credentials
  - age_private_keys
git_hooks:
  pre_commit:
    tool: detect-secrets
    baseline: .secrets.baseline
    description: >-
      Install: pip install detect-secrets
      Init:    detect-secrets scan > .secrets.baseline
      The pre-commit hook (added via .pre-commit-config.yaml) blocks commits
      that introduce new detected secrets.
