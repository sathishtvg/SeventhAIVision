[project]
name = "seventh-ai-vision-shared"
version = "0.1.0"
description = "Shared types (FrameJob, RealtimeEvent, enums) used by backend and ai-worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]
